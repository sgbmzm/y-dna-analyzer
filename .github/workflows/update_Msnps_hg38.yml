name: Update Msnps_hg38 VCF Reference File

on:
  schedule:
    - cron: '0 0 * * 0' # רץ בכל יום ראשון בחצות
  workflow_dispatch: # מאפשר הרצה ידנית בלחיצת כפתור

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # נחוץ לעדכון ה-Release ולביצוע Commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set current date
        id: date
        run: echo "NOW=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Download latest HG38 CSV
        run: |
          curl -L -o snps_hg38.csv https://ybrowse.org/gbrowse2/gff/snps_hg38.csv

      - name: Run conversion script
        run: |
          python additions/from_snpsCSV_to_Msnps_VCF.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add snps_hg38.csv
          # מבצע קומיט רק אם הקובץ השתנה מהפעם האחרונה
          git commit -m "Auto-update: HG38 data and VCF (${{ env.NOW }})" || echo "No changes to commit"
          git push

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: Msnps_hg38.vcf.gz
          tag_name: required_large_files
          body: "Updated HG38 VCF based on latest data from ybrowse. Date: ${{ env.NOW }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
